<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教室百寶箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#f0f4f8;color:#1a202c}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;padding:10px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-btn{cursor:pointer;border:none;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600;background:#e2e8f0;color:#4a5568}
.tab-btn.active{background:#667eea;color:#fff}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.panel{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
.btn{cursor:pointer;border:none;border-radius:8px;padding:10px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.btn-pri{background:#667eea;color:#fff}
.btn-suc{background:#48bb78;color:#fff}
.btn-dan{background:#fc8181;color:#fff}
.btn-war{background:#ecc94b;color:#744210}
input,textarea{border:2px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:15px;outline:none}
input:focus{border-color:#667eea}
h2{font-size:22px;margin-bottom:16px}
.tc{text-align:center}
.mb16{margin-bottom:16px}
.gap8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{display:none}.panel.show{display:block}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:30px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto}
.btn-gry{background:#edf2f7;color:#4a5568}
.sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sound-btn{cursor:pointer;border:none;border-radius:10px;padding:20px 10px;font-size:28px;background:#edf2f7;text-align:center}
.lg-txt{font-size:96px;font-weight:800;font-family:monospace;text-align:center;margin:20px 0}
.score-row{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:8px;background:#f7fafc;border-radius:10px;border:2px solid #e2e8f0}
</style>
</head>
<body>

<header>
  <h1>&#127784; 教室百寶箱</h1>
  <div id="clock"></div>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('rollcall')">點名</button>
  <button class="tab-btn" onclick="showTab('lottery')">抽籤</button>
  <button class="tab-btn" onclick="showTab('wheel')">轉盤</button>
  <button class="tab-btn" onclick="showTab('sound')">音效板</button>
  <button class="tab-btn" onclick="showTab('timer')">倒數</button>
  <button class="tab-btn" onclick="showTab('stopwatch')">碼表</button>
  <button class="tab-btn" onclick="showTab('group')">分組</button>
  <button class="tab-btn" onclick="showTab('score')">計分</button>
</nav>

<main>

<!-- 點名 -->
<div id="pan-rollcall" class="panel show">
  <h2>點名系統</h2>
  <div class="gap8 mb16">
    <input id="newStudent" placeholder="輸入學生姓名" style="flex:1;min-width:150px">
    <button class="btn btn-suc" onclick="addStudent()">新增</button>
    <button class="btn btn-war" onclick="resetAtt()">全部重置</button>
    <button class="btn btn-pri" onclick="randomPick()">隨機抽人</button>
    <button class="btn btn-pri" onclick="showImport()" style="background:#38b2ac">匯入名條</button>
    <button class="btn btn-war" onclick="exportList()">匯出名單</button>
  </div>
  <div id="stuList" class="gap8"></div>
  <div id="pickResult" style="margin-top:16px;font-size:28px;font-weight:700;color:#667eea;text-align:center;min-height:50px"></div>
</div>

<!-- 匯入彈窗 -->
<div id="importModal" class="modal" onclick="if(event.target==this)hideImport()">
  <div class="modal-box">
    <h2 style="margin-bottom:12px">匯入名條</h2>
    <p style="color:#718096;margin-bottom:12px;font-size:14px">每行一個姓名，或逗號/空格分隔。也可貼 Excel 複製的欄位。</p>
    <textarea id="importText" rows="10" style="width:100%;font-size:14px;margin-bottom:16px" oninput="countImport()" placeholder="貼上學生姓名，每行一個&#10;例如：&#10;張小華&#10;李小明&#10;王大同"></textarea>
    <div class="gap8">
      <button class="btn btn-suc" onclick="doImport()" style="font-size:16px;padding:12px 28px">確定匯入</button>
      <button class="btn btn-gry" onclick="hideImport()" style="padding:12px 28px">取消</button>
      <span style="font-size:13px;color:#a0aec0" id="importCount"></span>
    </div>
  </div>
</div>

<!-- 抽籤 -->
<div id="pan-lottery" class="panel tc">
  <h2>抽籤機</h2>
  <div class="mb16"><input id="lotInp" placeholder="輸入項目，逗號分隔" style="width:80%;max-width:400px" value="第1組,第2組,第3組,第4組,第5組"></div>
  <div id="lotDisp" style="font-size:72px;font-weight:800;color:#667eea;min-height:120px;display:flex;align-items:center;justify-content:center;margin:20px 0;background:#f7fafc;border-radius:16px;padding:20px;cursor:pointer" onclick="runLot()">點我抽！</div>
  <button class="btn btn-pri" style="font-size:20px;padding:14px 40px" onclick="runLot()">抽籤</button>
</div>

<!-- 轉盤 -->
<div id="pan-wheel" class="panel tc">
  <h2>幸運轉盤</h2>
  <div class="mb16"><input id="whInp" placeholder="輸入項目，逗號分隔" style="width:80%;max-width:400px" value="第1組,第2組,第3組,第4組,第5組" oninput="drawWh()"></div>
  <canvas id="whCanvas" width="340" height="340" style="margin:10px auto;display:block;max-width:100%"></canvas>
  <div id="whResult" style="font-size:24px;font-weight:700;min-height:40px;margin:8px 0"></div>
  <button class="btn btn-pri" style="font-size:18px;padding:12px 36px" onclick="spinWh()">轉！</button>
</div>

<!-- 音效板 -->
<div id="pan-sound" class="panel">
  <h2>音效板</h2>
  <p style="color:#718096;margin-bottom:16px">點擊下方按鈕播放音效</p>
  <div class="sound-grid" id="sndGrid"></div>
</div>

<!-- 倒數計時 -->
<div id="pan-timer" class="panel tc">
  <h2>倒數計時器</h2>
  <div class="gap8 mb16" style="justify-content:center">
    <input id="tmMin" type="number" value="5" min="0" style="width:80px;text-align:center;font-size:20px"> <span style="font-size:20px">分</span>
    <input id="tmSec" type="number" value="0" min="0" max="59" style="width:80px;text-align:center;font-size:20px"> <span style="font-size:20px">秒</span>
  </div>
  <div id="tmDisp" class="lg-txt" style="color:#667eea">05:00</div>
  <div class="gap8" style="justify-content:center">
    <button class="btn btn-suc" style="font-size:18px;padding:12px 30px" onclick="startTimer()">開始</button>
    <button class="btn btn-war" style="font-size:18px;padding:12px 30px" onclick="pauseTimer()">暫停</button>
    <button class="btn btn-dan" style="font-size:18px;padding:12px 30px" onclick="resetTimer()">重置</button>
  </div>
</div>

<!-- 碼表 -->
<div id="pan-stopwatch" class="panel tc">
  <h2>碼表</h2>
  <div id="swDisp" class="lg-txt" style="color:#667eea">00:00.0</div>
  <div class="gap8" style="justify-content:center">
    <button class="btn btn-suc" style="font-size:18px;padding:12px 30px" onclick="startSw()">開始</button>
    <button class="btn btn-war" style="font-size:18px;padding:12px 30px" onclick="stopSw()">停止</button>
    <button class="btn btn-dan" style="font-size:18px;padding:12px 30px" onclick="resetSw()">重置</button>
  </div>
  <div id="laps" style="margin-top:16px;max-height:200px;overflow-y:auto"></div>
</div>

<!-- 分組 -->
<div id="pan-group" class="panel">
  <h2>隨機分組</h2>
  <div class="mb8"><label>學生名單：</label></div>
  <textarea id="grpStu" rows="4" style="width:100%;margin-bottom:12px"></textarea>
  <div class="gap8 mb16">
    <label>每組人數：</label><input id="grpSize" type="number" value="4" min="2" max="20" style="width:70px;text-align:center;font-size:18px">
    <button class="btn btn-pri" onclick="doGroup()">分組！</button>
  </div>
  <div id="grpRes"></div>
</div>

<!-- 計分 -->
<div id="pan-score" class="panel">
  <h2>計分板</h2>
  <div class="gap8 mb16">
    <input id="tmName" placeholder="組別名稱" style="flex:1;min-width:120px">
    <button class="btn btn-suc" onclick="addTeam()">新增隊伍</button>
    <button class="btn btn-dan" onclick="resetScores()">重置分數</button>
  </div>
  <div id="scoreBd"></div>
</div>

</main>

<script>
var STU = ['張小華','李小明','王大同','陳小美','林小芳','黃大偉','劉小安','吳小慧','鄭小文','周大雄','許小雅','楊小龍','朱小莉','孫小剛','馬小鳳'];
var TEAMS = [];

function clock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
setInterval(clock,1000);clock();

document.getElementById('grpStu').value = STU.join('\n');

function showTab(t){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('show');});
  var el=document.getElementById('pan-'+t);if(el)el.classList.add('show');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){if(btns[i].getAttribute('onclick').indexOf(t)>-1)btns[i].classList.add('active');}
  if(t=='rollcall')renderStuList();
  if(t=='wheel')drawWh();
  if(t=='sound')initSound();
}

function renderStuList(){
  var el=document.getElementById('stuList');if(!el)return;
  el.innerHTML='';
  for(var i=0;i<STU.length;i++){
    var absent=STU[i+'_a'];
    var lbl=document.createElement('label');
    lbl.style.cssText='display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:2px solid;cursor:pointer;font-size:16px;background:'+(absent?'#fed7d7':'#f0fff4')+';border-color:'+(absent?'#fc8181':'#c6f6d5');
    var cb=document.createElement('input');cb.type='checkbox';cb.style.cssText='width:18px;height:18px';cb.checked=!!absent;
    cb.onchange=(function(idx){return function(){STU[idx+'_a']=!STU[idx+'_a'];renderStuList();};})(i);
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(STU[i]));
    var spn=document.createElement('span');spn.textContent='✖';spn.style.cssText='margin-left:4px;font-size:12px;color:#a0aec0;cursor:pointer';
    spn.onclick=(function(idx){return function(e){e.stopPropagation();STU.splice(idx,1);renderStuList();};})(i);
    lbl.appendChild(spn);
    el.appendChild(lbl);
  }
}

function addStudent(){
  var inp=document.getElementById('newStudent');var n=inp.value.trim();
  if(n){STU.push(n);inp.value='';renderStuList();}
}

function resetAtt(){for(var i=0;i<STU.length;i++)delete STU[i+'_a'];renderStuList();}

function randomPick(){
  var present=[];for(var i=0;i<STU.length;i++)if(!STU[i+'_a'])present.push(STU[i]);
  var pool=present.length?present:STU;
  if(!pool.length){document.getElementById('pickResult').textContent='沒有學生了！';return;}
  var el=document.getElementById('pickResult');
  var c=0;
  var iv=setInterval(function(){
    el.textContent=pool[Math.floor(Math.random()*pool.length)];
    el.style.color=['#667eea','#48bb78','#fc8181','#ecc94b','#ed8936'][Math.floor(Math.random()*5)];
    c++;if(c>20){clearInterval(iv);el.style.color='#e53e3e';}
  },80);
}

// 匯入匯出
function showImport(){document.getElementById('importModal').classList.add('show');document.getElementById('importText').value=STU.join('\n');countImport();}
function hideImport(){document.getElementById('importModal').classList.remove('show');}
function countImport(){var t=document.getElementById('importText').value;var n=t.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;}).length;document.getElementById('importCount').textContent='共 '+n+' 人';}
function doImport(){
  var t=document.getElementById('importText').value;
  var names=[];var parts=t.split('\n');
  for(var i=0;i<parts.length;i++){
    var line=parts[i].trim();if(!line)continue;
    var items=line.split(/[,，\s、]+/);
    for(var j=0;j<items.length;j++){var s=items[j].trim();if(s)names.push(s);}
  }
  if(!names.length)return;
  STU.length=0;for(var i=0;i<names.length;i++)STU.push(names[i]);
  hideImport();renderStuList();
  document.getElementById('grpStu').value=STU.join('\n');
}
function exportList(){
  var text=STU.join('\n');var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='學生名單_'+new Date().toISOString().slice(0,10)+'.txt';a.click();
  URL.revokeObjectURL(a.href);
}

// Lottery
function runLot(){
  var items=document.getElementById('lotInp').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  if(!items.length){document.getElementById('lotDisp').textContent='請輸入項目';return;}
  var d=document.getElementById('lotDisp');var c=0;
  var iv=setInterval(function(){
    d.textContent=items[Math.floor(Math.random()*items.length)];
    d.style.color='#667eea';c++;
    if(c>25){clearInterval(iv);d.style.color='#e53e3e';}
  },80);
}

// Wheel
var whColors=['#667eea','#48bb78','#ecc94b','#fc8181','#ed8936','#9f7aea','#38b2ac','#f687b3','#fcda8a','#7f9cf5','#68d391','#f6ad55'];
var whSpin=false;

function drawWh(){
  var c=document.getElementById('whCanvas');if(!c)return;
  var ctx=c.getContext('2d');var cx=c.width/2,cy=c.height/2,r=cx-10;
  var items=document.getElementById('whInp').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  if(!items.length){ctx.clearRect(0,0,c.width,c.height);return;}
  var a=2*Math.PI/items.length;ctx.clearRect(0,0,c.width,c.height);
  for(var i=0;i<items.length;i++){
    var sa=i*a-Math.PI/2,ea=sa+a;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();
    ctx.fillStyle=whColors[i%whColors.length];ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+a/2);
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='right';
    ctx.fillText(items[i].length>4?items[i].slice(0,4):items[i],r-12,4);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,12,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#667eea';ctx.lineWidth=3;ctx.stroke();
}

function spinWh(){
  if(whSpin)return;
  var c=document.getElementById('whCanvas');if(!c)return;
  var items=document.getElementById('whInp').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  if(!items.length)return;
  whSpin=true;
  var ctx=c.getContext('2d');var cx=c.width/2,cy=c.height/2,r=cx-10;
  var a=2*Math.PI/items.length;
  var angle=0,speed=Math.random()*0.3+0.4;
  var iv=setInterval(function(){
    angle+=speed;speed*=0.985;
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<items.length;i++){
      var sa=i*a-Math.PI/2+angle,ea=sa+a;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();
      ctx.fillStyle=whColors[i%whColors.length];ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+a/2);
      ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='right';
      ctx.fillText(items[i].length>4?items[i].slice(0,4):items[i],r-12,4);
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,12,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#667eea';ctx.lineWidth=3;ctx.stroke();
    if(speed<0.01){
      clearInterval(iv);whSpin=false;
      var idx=Math.floor((((2*Math.PI-angle%(2*Math.PI))%(2*Math.PI))/(2*Math.PI)*items.length)%items.length);
      document.getElementById('whResult').textContent='結果：'+items[idx];
    }
  },16);
}

// Sound
var sndInited=false;
function initSound(){
  if(sndInited)return;sndInited=true;
  var data=[{id:'bell',l:'上課鈴聲',e:'&#128276;'},{id:'applause',l:'掌聲',e:'&#128079;'},{id:'buzzer',l:'錯誤嗡',e:'&#128683;'},{id:'ding',l:'正確',e:'&#9989;'},{id:'drumroll',l:'鼓聲',e:'&#129377;'},{id:'ticktock',l:'滾動',e:'&#9200;'},{id:'cheer',l:'歡呼',e:'&#127881;'},{id:'boing',l:'彈跳',e:'&#128162;'},{id:'whistle',l:'哨子',e:'&#127927;'},{id:'laugh',l:'笑聲',e:'&#128516;'}];
  var g=document.getElementById('sndGrid');
  for(var i=0;i<data.length;i++){
    var b=document.createElement('button');b.className='sound-btn';
    b.innerHTML='<div>'+data[i].e+'</div><div>'+data[i].l+'</div>';
    b.onclick=(function(id){return function(){playSnd(id);};})(data[i].id);
    g.appendChild(b);
  }
}

function playSnd(id){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var osc=ctx.createOscillator();var gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);gain.gain.value=0.3;
    if(id=='bell'){osc.type='sine';osc.frequency.value=800;gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1.5);osc.start();osc.stop(ctx.currentTime+1.5);}
    else if(id=='applause'){osc.disconnect();for(var i=0;i<30;i++){var n=ctx.createBufferSource();var buf=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate);var d=buf.getChannelData(0);for(var j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);n.buffer=buf;var g=ctx.createGain();g.gain.value=0.15;n.connect(g);g.connect(ctx.destination);n.start(ctx.currentTime+Math.random()*0.8);}}
    else if(id=='buzzer'){osc.type='sawtooth';osc.frequency.value=150;gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.6);osc.start();osc.stop(ctx.currentTime+0.6);}
    else if(id=='ding'){osc.type='sine';osc.frequency.value=1000;gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);osc.start();osc.stop(ctx.currentTime+0.4);}
    else if(id=='drumroll'){osc.disconnect();for(var i=0;i<20;i++){var n=ctx.createBufferSource();var buf=ctx.createBuffer(1,ctx.sampleRate*0.08,ctx.sampleRate);var d=buf.getChannelData(0);for(var j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);n.buffer=buf;var g=ctx.createGain();g.gain.value=0.2;n.connect(g);g.connect(ctx.destination);n.start(ctx.currentTime+i*0.04);}}
    else if(id=='ticktock'){osc.type='sine';osc.frequency.value=2000;gain.gain.setValueAtTime(0.2,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.05);osc.start();osc.stop(ctx.currentTime+0.05);}
    else if(id=='cheer'){osc.disconnect();for(var i=0;i<40;i++){var n=ctx.createBufferSource();var buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);var d=buf.getChannelData(0);for(var j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);n.buffer=buf;var g=ctx.createGain();g.gain.value=0.1+Math.random()*0.1;n.connect(g);g.connect(ctx.destination);n.start(ctx.currentTime+Math.random()*0.6);}}
    else if(id=='boing'){osc.type='sine';osc.frequency.setValueAtTime(600,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(100,ctx.currentTime+0.4);gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);osc.start();osc.stop(ctx.currentTime+0.5);}
    else if(id=='whistle'){osc.type='sine';osc.frequency.setValueAtTime(1200,ctx.currentTime);osc.frequency.linearRampToValueAtTime(1800,ctx.currentTime+0.3);osc.frequency.linearRampToValueAtTime(1200,ctx.currentTime+0.6);gain.gain.setValueAtTime(0.2,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.7);osc.start();osc.stop(ctx.currentTime+0.7);}
    else if(id=='laugh'){osc.disconnect();for(var i=0;i<15;i++){var n=ctx.createBufferSource();var buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);var d=buf.getChannelData(0);for(var j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(Math.sin(j*Math.PI*2/d.length),4);n.buffer=buf;var g=ctx.createGain();g.gain.value=0.15;n.connect(g);g.connect(ctx.destination);n.start(ctx.currentTime+i*0.15);}}
  }catch(e){}
}

// Timer
var timerIv=null;var timerRem=0;
function updTimerDisp(){var d=document.getElementById('tmDisp');if(!d)return;var m=Math.floor(timerRem/60),s=timerRem%60;d.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;d.style.color=(timerRem<=10&&timerRem>0)?'#e53e3e':'#667eea';}
function startTimer(){if(timerIv)return;if(timerRem<=0){timerRem=(parseInt(document.getElementById('tmMin').value)||0)*60+(parseInt(document.getElementById('tmSec').value)||0);if(timerRem<=0)return;}updTimerDisp();timerIv=setInterval(function(){timerRem--;updTimerDisp();if(timerRem<=0){clearInterval(timerIv);timerIv=null;document.getElementById('tmDisp').textContent='時間到！';document.getElementById('tmDisp').style.color='#e53e3e';playSnd('bell');}},1000);}
function pauseTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function resetTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}timerRem=0;updTimerDisp();}

// Stopwatch
var swIv=null,swTime=0,swRun=false;
function fmtSw(t){var m=Math.floor(t/600),s=Math.floor((t%600)/10),ds=t%10;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+ds;}
function startSw(){if(swRun)return;swRun=true;swIv=setInterval(function(){swTime++;var d=document.getElementById('swDisp');if(d)d.textContent=fmtSw(swTime);},100);}
function stopSw(){swRun=false;if(swIv){clearInterval(swIv);swIv=null;}var lap=document.createElement('div');lap.textContent='&#9673; 前一圈: '+fmtSw(swTime);lap.style.cssText='padding:4px 8px;border-bottom:1px solid #e2e8f0';var el=document.getElementById('laps');if(el)el.prepend(lap);}
function resetSw(){swRun=false;if(swIv){clearInterval(swIv);swIv=null;}swTime=0;var d=document.getElementById('swDisp');if(d)d.textContent=fmtSw(0);document.getElementById('laps').innerHTML='';}

// Group
function doGroup(){
  var text=document.getElementById('grpStu').value;
  var names=[];var parts=text.split('\n');for(var i=0;i<parts.length;i++){var s=parts[i].trim();if(s)names.push(s);}
  var size=parseInt(document.getElementById('grpSize').value)||4;
  if(!names.length){document.getElementById('grpRes').innerHTML='<p style="color:#e53e3e">請輸入學生名單</p>';return;}
  var shuf=[];for(var i=0;i<names.length;i++)shuf.push(names[i]);
  for(var i=shuf.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=shuf[i];shuf[i]=shuf[j];shuf[j]=tmp;}
  var groups=[];for(var i=0;i<shuf.length;i+=size)groups.push(shuf.slice(i,i+size));
  var cols=['#667eea','#48bb78','#ecc94b','#fc8181','#ed8936','#9f7aea','#38b2ac','#f687b3'];
  var el=document.getElementById('grpRes');el.innerHTML='';
  for(var i=0;i<groups.length;i++){
    var div=document.createElement('div');div.style.cssText='border-radius:10px;padding:12px 16px;margin-bottom:10px;border:2px solid '+cols[i%cols.length]+';background:'+cols[i%cols.length]+'22';
    div.innerHTML='<h3 style="color:'+cols[i%cols.length]+';margin-bottom:6px">第'+(i+1)+'組 ('+groups[i].length+'人)</h3><div style="font-size:16px">'+groups[i].join('　')+'</div>';
    el.appendChild(div);
  }
}

// Score
function addTeam(){var inp=document.getElementById('tmName');var n=inp.value.trim();if(n){TEAMS.push({name:n,score:0});inp.value='';renderScoreBd();}}
function resetScores(){for(var i=0;i<TEAMS.length;i++)TEAMS[i].score=0;renderScoreBd();}
function delTeam(i){TEAMS.splice(i,1);renderScoreBd();}

function renderScoreBd(){
  var el=document.getElementById('scoreBd');if(!el)return;
  if(!TEAMS.length){el.innerHTML='<p style="color:#a0aec0">尚無隊伍，請新增</p>';return;}
  TEAMS.sort(function(a,b){return b.score-a.score;});
  el.innerHTML='';
  for(var i=0;i<TEAMS.length;i++){
    var t=TEAMS[i];
    var div=document.createElement('div');div.className='score-row';
    div.innerHTML='<span style="font-weight:700;font-size:18px;min-width:30px">#'+(i+1)+'</span>'+
      '<span style="flex:1;font-size:18px;font-weight:600">'+t.name+'</span>'+
      '<span style="font-size:28px;font-weight:800;color:#667eea;min-width:60px;text-align:center">'+t.score+'</span>'+
      '<button class="btn" style="background:#48bb78;color:#fff;padding:6px 14px" onclick="TEAMS['+i+'].score=Math.max(0,TEAMS['+i+'].score+1);renderScoreBd()">+1</button>'+
      '<button class="btn" style="background:#48bb78;color:#fff;padding:6px 14px" onclick="TEAMS['+i+'].score=Math.max(0,TEAMS['+i+'].score+5);renderScoreBd()">+5</button>'+
      '<button class="btn" style="background:#fc8181;color:#fff;padding:6px 14px" onclick="TEAMS['+i+'].score=Math.max(0,TEAMS['+i+'].score-1);renderScoreBd()">-1</button>'+
      '<span style="cursor:pointer;color:#fc8181;font-size:18px" onclick="delTeam('+i+')">&#10006;</span>';
    el.appendChild(div);
  }
}

renderStuList();
